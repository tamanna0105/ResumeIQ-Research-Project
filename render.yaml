services:
  - type: web
    name: resumeiq
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: RESUMEIQ_DB_PATH
        value: /tmp/resumeiq_experiments.sqlite3